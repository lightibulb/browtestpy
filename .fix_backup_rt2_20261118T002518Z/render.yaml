services:
  - type: web
    name: anonymity-verifier-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: anonymity-verifier-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: anonymity-verifier-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: anonymity-verifier-redis
          property: connectionString

  - type: worker
    name: anonymity-verifier-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.core.celery_app.celery worker --loglevel=info --pool=solo
    plan: starter
    region: oregon
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: anonymity-verifier-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: anonymity-verifier-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: anonymity-verifier-redis
          property: connectionString

  - type: redis
    name: anonymity-verifier-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
