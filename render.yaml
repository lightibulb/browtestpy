# Render Blueprint for LeakGuard.
#
# Plans:
#   - web:    free     (sleeps after 15 min idle; ~30s cold start on wake)
#   - worker: standard  (paid — Render offers no free background worker plan)
#   - redis:  free     (25 MB, volatile-lru eviction; results + history + agent
#                       reports share this budget. Upgrade if you run many
#                       scans or expect large Playwright fingerprints.)
#
# Health checks:
#   - healthCheckPath: /health  (liveness — 200 unless the process is dead)
#   - GET /ready                (readiness — 503 when Redis is unreachable;
#                                point an external uptime monitor here, NOT
#                                Render's healthCheckPath, to avoid restart
#                                loops when Redis blips.)
#
# Port:
#   Render injects $PORT at runtime; the Dockerfile honours it via
#   `--port ${PORT:-8000}`. No port env var is needed in this file.
#
# Branch:
#   `branch: main` is set explicitly on web and worker so a default-branch
#   rename in the GitHub repo does not silently break the blueprint.
#
services:
  - type: web
    branch: main
    name: anonymity-verifier-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: anonymity-verifier-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: anonymity-verifier-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: anonymity-verifier-redis
          property: connectionString

  - type: worker
    branch: main
    name: anonymity-verifier-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.core.celery_app.celery worker --loglevel=info --pool=solo
    plan: standard
    region: oregon
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: anonymity-verifier-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: anonymity-verifier-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: anonymity-verifier-redis
          property: connectionString

  - type: redis
    name: anonymity-verifier-redis
    plan: free
    region: oregon
    ipAllowList: []
    # F6: volatile-lru only evicts keys that carry a TTL (results,
    # summaries, agent reports). Celery queue keys have no TTL, so the
    # broker can no longer silently drop queued scans.
    maxmemoryPolicy: volatile-lru
